name: CI

on:
  pull_request:
  workflow_dispatch:
  # The release workflow reuses these checks before it publishes a tag.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (format, lint, typecheck, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  rust:
    name: Rust backend (cargo test, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked

  package:
    name: Package (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64, target: '' }
          - { os: macos-15, label: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15, label: macos-x64, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, label: linux-x64, target: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}
      - name: Linux system libraries for the webview and tray
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      # Pull requests build unsigned installers; only the release workflow signs updater artifacts.
      - name: Build installers
        run: npx tauri build${{ matrix.target && format(' --target {0}', matrix.target) || '' }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: orbit-pr${{ github.event.pull_request.number || 0 }}-${{ github.sha }}-${{ matrix.label }}
          path: |
            src-tauri/target/*/release/bundle/*/*.exe
            src-tauri/target/*/release/bundle/*/*.dmg
            src-tauri/target/*/release/bundle/*/*.AppImage
            src-tauri/target/*/release/bundle/*/*.deb
            src-tauri/target/release/bundle/*/*.exe
            src-tauri/target/release/bundle/*/*.dmg
            src-tauri/target/release/bundle/*/*.AppImage
            src-tauri/target/release/bundle/*/*.deb
          if-no-files-found: error
          retention-days: 7
