name: Release

# Pushing vX.Y.Z publishes a GitHub Release with a signed installer and the updater manifest (latest.json).
# Nothing else publishes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  guard:
    name: Tag matches package.json and is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag, package version, and branch
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ]; then
            echo "Tag v$tag does not match package.json ($pkg) or tauri.conf.json ($conf)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

  # Every check that gates a pull request, rerun on the tagged commit.
  verify:
    name: Checks
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, sign, and publish (${{ matrix.label }})
    needs: [guard, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64, target: '' }
          - { os: macos-15, label: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15, label: macos-x64, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, label: linux-x64, target: '' }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}
      - name: Linux system libraries for the webview and tray
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orbit ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Updater artifacts (signed bundles and .sig files) are built only here, where the signing key is available.
          args: ${{ matrix.target && format('--target {0} ', matrix.target) || '' }}--config '{"bundle":{"createUpdaterArtifacts":true}}'
