appId: dev.orbit.app
productName: Orbit
copyright: Copyright © 2026 Orbit contributors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - build/icon.png
  - package.json
asar: true
# Unsigned builds for v1: no code signing or notarization.
forceCodeSigning: false
afterPack: scripts/after-pack.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  identity: null
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  maintainer: Orbit contributors <chetjones003@users.noreply.github.com>
  vendor: Orbit
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
