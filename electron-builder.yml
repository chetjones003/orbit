appId: dev.orbit.app
productName: Orbit
copyright: Copyright © 2026 Orbit contributors
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
asar: true
# Public GitHub Releases feed for electron-updater (latest*.yml). CI publishes; local builds never upload.
publish:
  provider: github
  owner: chetjones003
  repo: orbit
  releaseType: release
# Unsigned builds for v1: no code signing or notarization.
forceCodeSigning: false
afterPack: scripts/after-pack.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Removes every earlier Orbit install before the new one is written. See build/installer.nsh.
  include: build/installer.nsh
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  identity: null
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  maintainer: Orbit contributors <chetjones003@users.noreply.github.com>
  vendor: Orbit
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
